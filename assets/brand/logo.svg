<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="StreamVault">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262c34"/>
      <stop offset="1" stop-color="#090b0e"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2f7"/>
      <stop offset="0.5" stop-color="#5c6673"/>
      <stop offset="1" stop-color="#191d23"/>
    </linearGradient>
    <linearGradient id="s-outline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1f26"/>
      <stop offset="1" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.38" stop-color="#dbe2ea"/>
      <stop offset="0.49" stop-color="#8b95a3"/>
      <stop offset="0.51" stop-color="#3a414c"/>
      <stop offset="0.6" stop-color="#b4bec9"/>
      <stop offset="0.8" stop-color="#e2e8ef"/>
      <stop offset="1" stop-color="#f4f7fa"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="90" height="90" rx="22" fill="url(#plate)" stroke="url(#bevel)" stroke-width="2.5"/>
  <rect x="8" y="8" width="80" height="80" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>

  <path d="M 14 30 Q 48 10 82 28" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="7" stroke-linecap="round"/>

  <path d="M63 33 A15 15 0 1 0 48 48 A15 15 0 1 1 33 63"
        fill="none" stroke="url(#s-outline)" stroke-width="13.5" stroke-linecap="round"
        filter="url(#soft-shadow)"/>
  <path d="M63 33 A15 15 0 1 0 48 48 A15 15 0 1 1 33 63"
        fill="none" stroke="url(#chrome)" stroke-width="10.5" stroke-linecap="round"/>
</svg>
